<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>document.documentElement.classList.add('js')</script>

    <!-- Primary meta. Estos son los valores de la PORTADA y, además, lo único
         que ven los rastreadores que no ejecutan JavaScript (los de IA, entre
         otros). Deben coincidir palabra por palabra con `seo.home` de
         src/i18n/es.json, que es lo que `installSeo` escribe en caliente: si
         divergen, cada rastreador se lleva una versión distinta del sitio.
         El título anterior medía 76 caracteres y Google lo truncaba. -->
    <title>Clipeo — App de estadísticas de voleibol en directo para iPad y Android</title>
    <meta
      name="description"
      content="App de estadísticas de voleibol para iPad y Android. Anota el partido incluso sin conexión, comparte las estadísticas en directo y analiza cada set. Gratis para empezar."
    />
    <meta name="keywords" content="estadísticas de voleibol, app estadísticas voleibol iPad, app estadísticas voleibol Android, scouting voleibol, análisis de partidos de voleibol, estadísticas en directo voleibol, app para entrenadores de voleibol, marcador voleibol en vivo, estadísticas voley" />
    <meta name="author" content="Clipeo" />
    <meta name="google-site-verification" content="64DBXpmvUMBBUba4FeEOeNQjGns85ZFY_QgM_tdsntw" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#070A12" />
    <!-- Dominio: sustituido de voleystats.vercel.app a clipeostats.com en el
         rebranding a Clipeo (2026-09). Fuera de este archivo estático, la
         fuente única del dominio es VITE_SITE_ORIGIN (ver
         src/composables/useSeo.ts y scripts/prerender-head.mjs). -->
    <link rel="canonical" href="https://clipeostats.com/" />

    <!-- Icons / PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <!-- El nombre del sitio debe ser IDÉNTICO aquí, en el schema WebSite de
         abajo, en Organization y en App Store Connect. Cuando esas señales se
         contradecían ("Voley Stats" vs "Voley Stats Live" vs "Voley stats") y
         además faltaba por completo el schema WebSite, Google se inventó la
         etiqueta del sitio y la mostraba como "volley stata" en su búsqueda
         con IA. No introduzcas variantes nuevas.
         Rebranding a Clipeo (2026-09): el nombre canónico pasa a ser "Clipeo"
         (sola; "Stats" es descriptivo, no parte de la marca). "Voley Stats" se
         mantiene como alternateName en los JSON-LD de abajo para que Google
         resuelva la entidad renombrada en vez de tratarla como una nueva;
         retirarlo de ahí pasados ~6 meses (objetivo: marzo 2027). -->
    <meta property="og:site_name" content="Clipeo" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Clipeo — App de estadísticas de voleibol para iPad y Android" />
    <meta
      property="og:description"
      content="Anota cada acción del partido desde la tablet, incluso sin conexión, y comparte el marcador y las estadísticas en directo. Análisis por fases, mapas de ataque e informes de scouting."
    />
    <meta property="og:url" content="https://clipeostats.com/" />
    <meta property="og:image" content="https://clipeostats.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clipeo: estadísticas de voleibol en directo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clipeo — App de estadísticas de voleibol para iPad y Android" />
    <meta name="twitter:description" content="Estadísticas de voleibol en directo: anota el partido desde la tablet sin conexión, comparte el marcador en vivo y analiza cada set con informes de scouting." />
    <meta name="twitter:image" content="https://clipeostats.com/og-image.png" />

    <!-- Fonts: auto-hospedadas en /fonts (ver src/styles/fonts.css).
         NO volver a cargarlas desde fonts.googleapis.com: la CSP de
         vercel.json es 'self' en style-src y font-src, asi que la hoja de
         Google se bloquea y las fuentes caen a system-ui sin aviso. Ademas
         el overlay corre dentro de OBS en emision y no debe depender de un
         tercero. -->

    <!-- Structured data: SoftwareApplication.
         El array de ofertas se deja VACÍO a propósito: `scripts/prerender-head.mjs`
         lo rellena en el build desde `src/data/plans.json`, la misma fuente que
         pinta /pricing. (Este comentario no puede escribir el ancla literal: el
         script busca la primera aparición y la reemplazaría aquí.) Los precios escritos a mano aquí son los que nadie
         recuerda actualizar el día que cambia una tarifa.
         `featureList` sí es manual — al tocarla, usa los nombres comerciales
         de STORE.md (Análisis / Análisis Live), nunca los tiers técnicos. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Clipeo",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "iPadOS, Android",
        "description": "App de estadísticas de voleibol para iPad y Android. Captura cada acción del partido con la rejilla rápida o sobre el mapa de la pista con Rally Map (trayectorias de ataque y saque), con marcador, rotación y sacador automáticos. Funciona completamente sin conexión; internet solo hace falta para el directo en la web, el overlay para OBS, la página pública del equipo y la copia en la nube. Descargar y anotar partidos es gratis; el plan Análisis añade Rally Map, histórico y estadísticas de temporada e informes en PDF; el plan Análisis Live añade compartir partidos en directo, overlay para OBS y página pública del equipo.",
        "url": "https://clipeostats.com/",
        "installUrl": "https://apps.apple.com/us/app/voley-stats/id6737778450",
        "downloadUrl": "https://apps.apple.com/us/app/voley-stats/id6737778450",
        "sameAs": ["https://apps.apple.com/us/app/voley-stats/id6737778450"],
        "inLanguage": ["es", "en"],
        "offers": [],
        "featureList": [
          "Captura rápida en rejilla pensada para entrenar y anotar a la vez",
          "Rally Map: captura sobre el mapa de la pista con trayectorias de ataque y saque (plan Análisis)",
          "Marcador, rotación y sacador automáticos",
          "Recepción valorada en 4 niveles y calidad de saque",
          "Seguimiento por fases K1/K2",
          "Funciona sin conexión (base de datos local)",
          "Estadísticas en directo en la web, gratis para cualquiera con el código",
          "Compartir partidos en directo, overlay para OBS y página pública del equipo (plan Análisis Live)",
          "Informe post-partido: side-out/break, rotaciones, mapas de ataque, conexiones colocadora-atacante",
          "Histórico de equipo, estadísticas de temporada e informes en PDF (plan Análisis)",
          "Scouting de rivales: histórico agregado por rival con sus rotaciones, recepción, corredores de ataque y zonas de peligro; capturar los partidos del rival contra terceros requiere el plan Análisis",
          "Comparador de partidos cara a cara: métricas clave, side-out por rotación y anotadoras",
          "Alertas inteligentes durante el partido: rachas, punto de set, rotación atascada, ataque predecible",
          "Resumen entre sets pensado para los 3 minutos de descanso",
          "Fichas de jugadora con radar de habilidades, ataque, saque-recepción y evolución física (plan Análisis)"
        ]
      }
    </script>

    <!-- Structured data: WebSite.
         Este bloque FALTABA (el comentario de abajo decía "Organization +
         WebSite" pero solo había Organization). Es el schema del que Google
         saca el nombre del sitio en resultados: sin él, y con og:site_name y
         Organization discrepando, generaba el nombre por su cuenta y lo
         mostraba mal. `alternateName` recoge las variantes que ya circulan
         para que las resuelva a esta misma entidad en vez de inventarse otra. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Clipeo",
        "alternateName": ["Clipeo Stats", "Voley Stats"],
        "url": "https://clipeostats.com/",
        "inLanguage": ["es", "en"]
      }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Clipeo",
        "alternateName": ["Clipeo Stats", "Voley Stats"],
        "url": "https://clipeostats.com/",
        "logo": "https://clipeostats.com/logo.png",
        "email": "voleystats@gmail.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "voleystats@gmail.com",
          "contactType": "customer support",
          "url": "https://clipeostats.com/contact",
          "availableLanguage": ["es", "en"]
        }
      }
    </script>

    <!-- Structured data: FAQPage.
         NO se escribe a mano: lo inyecta `scripts/prerender-head.mjs` (post-build)
         a partir de `home.faq` de `src/i18n/{es,en}.json`, que es la misma fuente
         que pinta el acordeón de la portada. Antes vivía aquí copiado a mano y se
         quedó desincronizado (seguía diciendo "plan Normal"/"plan Pro" meses
         después del rename a Análisis/Análisis Live), y además el propio script lo
         BORRABA de todas las páginas —portada incluida—, así que el marcado no
         llegaba a publicarse nunca. Este comentario es el ancla que busca el
         script: si desaparece, el build falla. -->
    <!-- @faq-jsonld -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width:640px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#e2e8f0;background:#070A12">
        <h1>Clipeo — Estadísticas de voleibol en directo</h1>
        <p>
          Clipeo es una app para iPad y Android para capturar y analizar estadísticas
          de voleibol. Anota cada acción del partido —incluso sin conexión—,
          sigue el marcador y las estadísticas en directo desde esta web,
          analiza cada set por fases y jugadoras y genera informes de scouting.
          Activa JavaScript para usar la web.
        </p>
        <p>
          <a href="https://apps.apple.com/us/app/voley-stats/id6737778450" style="color:#7dd3fc">Descargar Clipeo en el App Store</a>
        </p>
        <!-- Grafo de enlaces para rastreadores. TODOS los enlaces internos del
             sitio viven dentro de componentes Vue (`RouterLink`), así que el
             HTML servido no tenía ni un solo <a href>: Search Console reportaba
             /team-code como "Google no reconoce esta URL — no se ha detectado
             ninguna página de referencia", es decir jamás rastreada. Google sí
             renderiza JS, pero eso va a una cola diferida que en un dominio sin
             autoridad puede no llegar nunca, y los rastreadores de IA no
             renderizan en absoluto. Estos enlaces son la única vía de
             descubrimiento que no depende de ejecutar JavaScript.
             Al añadir una ruta estática indexable, añádela también aquí (y en
             `scripts/prerender-head.mjs` y `public/sitemap.xml`). -->
        <nav>
          <h2>Secciones</h2>
          <ul>
            <li><a href="/" style="color:#7dd3fc">Inicio: qué es Clipeo</a></li>
            <li><a href="/team-code" style="color:#7dd3fc">Ver estadísticas en directo con el código del equipo</a></li>
            <li><a href="/pricing" style="color:#7dd3fc">Precios y planes: gratis, Análisis y Análisis Live</a></li>
            <li><a href="/contact" style="color:#7dd3fc">Contacto</a></li>
            <li><a href="/privacy" style="color:#7dd3fc">Política de privacidad</a></li>
            <li><a href="/terms" style="color:#7dd3fc">Condiciones de uso</a></li>
            <li><a href="/delete-account" style="color:#7dd3fc">Eliminar cuenta</a></li>
          </ul>
        </nav>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
