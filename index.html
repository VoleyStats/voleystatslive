    <!-- Structured data: FAQ (mantener sincronizado con src/i18n/es.json → home.faq) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Qué es Voley Stats Live?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Es la web en directo de Voley Stats, la app de iPad para capturar y analizar estadísticas de voleibol. Anotas cada acción del partido desde la app y cualquiera puede seguir el marcador y las estadísticas en vivo desde esta web, gratis y sin registrarse."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo consulto las estadísticas de mi equipo online?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Entra en la sección 'Ver en vivo', introduce el código de tu equipo y accede al marcador y a las estadísticas del partido en directo, con desglose por set y por jugador."
            }
          },
          {
            "@type": "Question",
            "name": "¿Qué estadísticas puedo registrar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Todo lo que pasa en la pista: cada toque o solo las acciones que acaban en punto, trayectorias de ataque y saque sobre el mapa de la pista, recepción valorada en 4 niveles, calidad de saque, juego por fases K1/K2, cambios y tiempos muertos. El marcador, la rotación y el sacador se actualizan solos."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo descargar un informe del partido?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Al terminar el partido la app genera un informe completo: side-out y break, origen de los puntos, rotaciones, ataque por fase y por calidad de pase, conexiones colocadora-atacante, errores no forzados y mapas de ataque (si capturaste ese partido con Rally Map). Exportarlo en PDF está disponible con el plan Normal o con un match pass para ese partido."
            }
          },
          {
            "@type": "Question",
            "name": "¿Necesito conexión a internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No para anotar: la app funciona completamente sin conexión, así que puedes capturar y consultar estadísticas en cualquier pabellón. Solo necesitas internet para compartir el directo en esta web, y para el overlay para OBS o la página pública del equipo (ambos del plan Pro), o para la copia de seguridad en la nube (plan Normal)."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuánto cuesta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Descargar la app y anotar tus partidos —captura completa y estadísticas de cada partido y set— es gratis. El plan Normal (19,99 €/año o 3,99 €/mes) añade Rally Map, el histórico del equipo y las estadísticas de temporada con filtros, informes en PDF, sincronización multi-dispositivo, copia de seguridad en la nube y exportación de equipo/torneo. El plan Pro (34,99 €/año o 6,99 €/mes) suma compartir partidos en directo, el overlay para OBS, la página pública del equipo y compartir el equipo con otros entrenadores. También hay un match pass de 2,99 € para desbloquear el directo, el Rally Map y el informe en PDF de un solo partido, sin suscripción. Ver los directos desde la web es siempre gratis para quien recibe el código."
            }
          }
